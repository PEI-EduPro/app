[project]
name = "api"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]>=0.119.0",
    "psycopg[binary,pool]>=3.2.11",
    "sqlmodel>=0.0.27",
    "python-keycloak>=3.3.0",
    "pyjwt[crypto]>=2.8.0",
    "python-multipart>=0.0.9",
    "authlib>=1.3.0",
    "asyncpg>=0.29.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.3",
    "reportlab>=4.4.5",
    "latex>=0.7.0",
    "opencv-python-headless>=4.9.0",
    "imutils>=0.5.4",
    "numpy>=1.26",
    "scipy>=1.17.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
]

[tool.pytest.ini_options]
pythonpath = "src"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
timeout = 5
