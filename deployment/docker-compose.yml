name: edupro

services:
  db:
    image: postgres:18-alpine
    env_file:
      - .env
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - db_data:/var/lib/postgresql
    restart: unless-stopped

  keycloak-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${KC_DB_NAME}
      POSTGRES_USER: ${KC_DB_USER}
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD}
    volumes:
      - keycloak_db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${KC_DB_USER} -d ${KC_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/${KC_DB_NAME}
      KC_DB_USERNAME: ${KC_DB_USER}
      KC_DB_PASSWORD: ${KC_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    command: start --import-realm --hostname ${KC_HOSTNAME} --hostname-path /keycloak --proxy-headers forwarded --http-enabled=true --hostname-port ${KC_HOSTNAME_PORT}
    volumes:
      - ./keycloak-config/realm.json:/opt/keycloak/data/import/realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    env_file:
      - .env
    volumes:
      - exam_images:/app/images
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: 
      context: ../web
      dockerfile: Dockerfile
    ports:
      - "${WEB_PORT}:80"
      - "${SSL_PORT}:443"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro  #muda isto se quiseres local
      - ./nginx_certs:/certs:ro
    depends_on:
      - api
    restart: unless-stopped

volumes:
  db_data:
  keycloak_db_data:
  exam_images: