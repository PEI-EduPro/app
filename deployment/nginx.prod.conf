events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    large_client_header_buffers 4 8k;
    proxy_buffers   4 32k;
    proxy_buffer_size   32k;

    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

    upstream backend {
        server api:80;
    }

    server {
        listen 80;
        listen [::]:80;

        return 301 https://$host:9042$request_uri;
}

    server {
        listen 443;
        listen [::]:443;
        server_name bioinformatics.ua.pt;

        # Photo upload endpoint - higher body size limit
        location ~ ^/edupro/api/exams/[^/]+/session/evaluate$ {
            limit_req zone=api_limit burst=20 nodelay;
            client_max_body_size 50M;

            rewrite ^/edupro/api/(.*)$ /api/$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host:9042;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 9042;

            proxy_connect_timeout 120s;
            proxy_send_timeout 120s;
            proxy_read_timeout 120s;
        }

        # API routes - proxy to backend service
        location /edupro/api/ {
            limit_req zone=api_limit burst=20 nodelay;

            rewrite ^/edupro/api/(.*)$ /api/$1 break;
            proxy_pass http://backend;
            proxy_set_header Host $host:9042;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port 9042;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;
        }

        # Health check endpoint for the API
        location /health {
            limit_req zone=api_limit burst=5 nodelay;
            
            proxy_pass http://backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Keycloak routes - proxy to keycloak service
        location ^~ /edupro/keycloak/ {
            proxy_pass http://keycloak:8080/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Frontend routes - serve static files and handle SPA routing
        location /edupro/ {
            alias /usr/share/nginx/html/;
            try_files $uri $uri/ /edupro/index.html;
            index index.html;
        }

        location = /edupro/index.html {
            alias /usr/share/nginx/html/index.html;
        }

        # Optimize static asset caching
        location ~* ^/edupro/(.+\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot))$ {
            alias /usr/share/nginx/html/$1;

            # Cache static assets for 1 year
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Block access to sensitive files
        location ~ /\. {
            deny all;
        }

        # Custom error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
