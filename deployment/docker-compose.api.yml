services:
  migrate:
    build:
      context: ../api
      dockerfile: Dockerfile
    env_file:
      - .env
    command: ["/app/.venv/bin/alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: on-failure

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "${API_PORT}:80"
    volumes:
      - exam_images:/app/images
      - exam_storage:/app/storage
      - ../api/src:/app/src
    dns:
      - 8.8.8.8
      - 8.8.4.4
    extra_hosts:
      - "smtp.gmail.com:142.250.102.108"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  exam_images:
  exam_storage:
